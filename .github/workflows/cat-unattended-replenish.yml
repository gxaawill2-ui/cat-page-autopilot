name: Cat Page Unattended AI Replenishment (opt-in, future-only)
"on":
  schedule:
    # Scheduling can drift; posts are submitted 1-3 days in advance.
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only inventory check (default true)'
        type: boolean
        required: true
        default: true
permissions:
  contents: write
concurrency:
  group: cat-page-native-post-writer
  cancel-in-progress: false
jobs:
  replenish:
    if: vars.CAT_AUTOPILOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAT_AUTOPILOT_ENABLED: ${{ vars.CAT_AUTOPILOT_ENABLED }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      AUTOPILOT_TEXT_MODEL: nvidia/nemotron-3.5-lightning-free
      AUTOPILOT_IMAGE_MODEL: bfl/flux-3-image-klein
      AUTOPILOT_VISION_MODEL: inclusionai/ling-3.0-flash-vl-free
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image validator
        run: python3 -m pip install 'Pillow>=11,<13'
      - name: Run no-write safety tests
        run: python3 -m unittest discover -s scripts -p test_auto_replenish.py -v
      - name: Replenish 3-day buffer via Meta native future scheduling
        shell: bash
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_KIND: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_KIND" == "workflow_dispatch" && "$MANUAL_DRY_RUN" != "false" ]]; then
            python3 scripts/auto_replenish.py --dry-run
          else
            python3 scripts/auto_replenish.py
          fi
