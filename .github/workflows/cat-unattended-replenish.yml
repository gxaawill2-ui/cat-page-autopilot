name: Cat Page Unattended AI Replenishment (opt-in, future-only)
"on":
  schedule:
    # Scheduling can drift; posts are submitted 1-3 days in advance.
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      review_only:
        description: 'Read-only three-day performance review; no AI or Facebook writes'
        type: boolean
        required: true
        default: false
      dry_run:
        description: 'Read-only inventory check (default true)'
        type: boolean
        required: true
        default: true
permissions:
  contents: write
  pages: write
concurrency:
  group: cat-page-meta-official-publisher
  cancel-in-progress: false
jobs:
  replenish:
    if: vars.CAT_AUTOPILOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CAT_AUTOPILOT_ENABLED: ${{ vars.CAT_AUTOPILOT_ENABLED }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refuse production writes from a PR checkout
        if: github.ref != 'refs/heads/main' && inputs.dry_run != true
        run: echo 'Live preparation requires an accepted main checkout; no writes attempted'; exit 1
      - name: Install image validator
        run: python3 -m pip install 'Pillow>=11,<13'
      - name: Run no-write safety tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Replenish 3-day buffer via Meta native future scheduling
        if: inputs.review_only != true
        shell: bash
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_KIND: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_KIND" == "workflow_dispatch" && "$MANUAL_DRY_RUN" != "false" ]]; then
            python3 scripts/auto_replenish.py --dry-run
          else
            python3 scripts/auto_replenish.py
          fi
      - name: Record due three-day performance review using actual Page posts only
        if: always() && github.ref == 'refs/heads/main' && (inputs.dry_run != true || inputs.review_only == true)
        run: python3 scripts/performance_review.py
