name: Cat Page Python Safety Tests
"on":
  push:
    branches: [main]
    paths:
      - catflow.py
      - dispatch_guard.py
      - test_catflow.py
      - test_dispatch_guard.py
      - state/legacy_quarantine.json
      - .github/workflows/unit-tests.yml
      - scripts/meta_graph_publish.py
      - scripts/test_meta_graph_publish.py
      - .github/workflows/meta-graph-publish.yml
  workflow_dispatch:
    inputs:
      generate_canary:
        description: 'One original Cloudflare generation on feature branch only; no Facebook writes'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free image dependency
        run: python -m pip install Pillow
      - name: Run project tests without Facebook writes
        run: |
          python -m unittest discover -v -p 'test_*.py'
          python -m unittest discover -v -s scripts -p 'test_meta_graph_publish.py'
          python -m unittest discover -v -s scripts -p 'test_auto_replenish.py'
          python -m unittest discover -v -s scripts -p 'test_meta_native_schedule.py'
          python -m unittest discover -v -s scripts -p 'test_cloudflare_ai.py'
  cloudflare-read-only-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check actual Workers AI model-list access (GET only; no inference or Facebook writes)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cloudflare_ai.py --audit
  cloudflare-original-canary:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_canary == true
    needs: [safety-tests, cloudflare-read-only-audit]
    permissions:
      contents: write
    concurrency:
      group: cat-cloudflare-single-canary
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Single original generation and vision acceptance (no Meta credentials)
        env:
          CF_CANARY_ENABLED: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cloudflare_canary.py
      - name: Preserve recovery evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-original-canary-${{ github.run_id }}
          path: |
            records/canary/
          retention-days: 7
