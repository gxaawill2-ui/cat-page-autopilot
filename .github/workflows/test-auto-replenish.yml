name: Cat Autopilot No-Write Safety CI
"on":
  pull_request:
    paths:
      - 'scripts/auto_replenish.py'
      - 'scripts/test_auto_replenish.py'
      - '.github/workflows/cat-unattended-replenish.yml'
      - '.github/workflows/test-auto-replenish.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Verify unattended pipeline guardrails (no tokens, no Meta writes)
        run: |
          python3 -m py_compile scripts/auto_replenish.py scripts/meta_native_schedule.py
          python3 -m unittest discover -s scripts -p test_auto_replenish.py -v
