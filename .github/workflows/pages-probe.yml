name: Anonymous Pages image verification
on:
  push:
    branches: [main]
    paths: ['records/drafts/**', 'records/pages-requests/**', 'pages_probe.py', '.github/workflows/pages-probe.yml']
permissions:
  contents: write
concurrency:
  group: pages-image-probe
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Allow Pages deployment to settle
        run: sleep 40
      - name: Anonymous GET MIME and SHA validation
        run: python3 pages_probe.py
      - name: Persist actual results without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add records/pages-proofs
          git diff --cached --quiet && exit 0
          git commit -m 'Record anonymous Pages verification receipts'
          git push origin HEAD:main
