name: Meta Official Page Checks (immediate publishing retired)
"on":
  workflow_dispatch:
    inputs:
      slot:
        description: 'Read-only dry-run slot; cannot publish'
        required: true
        type: choice
        options: ['09:30', '12:30', '16:30', '19:30']
      preflight_only:
        description: 'Meta GET only; never schedules or publishes'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: cat-page-meta-official-publisher
  cancel-in-progress: false
jobs:
  checks:
    name: Read-only checks - old immediate publisher retired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      MANUAL_SLOT: ${{ inputs.slot }}
      MANUAL_PREFLIGHT: ${{ inputs.preflight_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing safety tests without Facebook writes
        run: python3 -m unittest discover -s scripts -p test_meta_graph_publish.py -v
      - name: Read-only Meta GET or local dry-run - no live branch
        shell: bash
        run: |
          if [[ "$MANUAL_PREFLIGHT" == 'true' ]]; then
            python3 scripts/meta_graph_publish.py --preflight
          else
            python3 scripts/meta_graph_publish.py --slot "$MANUAL_SLOT" --dry-run
          fi
