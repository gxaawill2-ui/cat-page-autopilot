name: Meta Native Scheduler (manual preparation - no cron)
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit/dry-run are read-only; schedule creates Meta-native future posts; verify only reads back'
        required: true
        type: choice
        default: audit
        options: ['audit', 'dry-run', 'schedule', 'verify']
      queue:
        description: 'Canonical queue/meta/YYYY-MM-DD/HHMM.json; empty only for audit'
        required: false
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: cat-page-meta-official-publisher
  cancel-in-progress: false
jobs:
  prepare_meta_native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      NATIVE_MODE: ${{ inputs.mode }}
      NATIVE_QUEUE: ${{ inputs.queue }}
    steps:
      - uses: actions/checkout@v4
      - name: Native scheduling safety tests - mocked writes only
        run: python3 -m unittest discover -s scripts -p test_meta_native_schedule.py -v
      - name: Prepare Meta native schedule or read-only audit - never immediate publish
        shell: bash
        run: python3 scripts/meta_native_schedule.py --mode "$NATIVE_MODE" --queue "$NATIVE_QUEUE"
