<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓咪投資筆記｜原創作品</title><style>body{max-width:850px;margin:50px auto;padding:0 20px;background:#faf6ef;color:#352a24;font:18px/1.7 system-ui}h1{font-size:30px}article{background:white;padding:24px;margin:28px 0;border-radius:20px}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}small{color:#695d52}</style><h1>貓咪投資筆記</h1><p>貓咪眼中的投資與生活。這裡保存本專案的原創圖像作品。</p><small>原創內容作品集 · 不提供交易、付費服務或投資建議</small><main id="gallery"></main><script>fetch('./gallery.json').then(r=>r.json()).then(data=>{for(const d of data){const a=document.createElement('article'),im=document.createElement('img'),p=document.createElement('p');im.src=d.image_url;im.alt=d.topic;im.loading='lazy';p.textContent=d.caption;a.append(im,p);document.querySelector('#gallery').append(a)}})</script></html>
